<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangeur</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#5f5f5a; --line:#e3e2dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#a3a29b; --line:#2c2c2a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); }
  a { color:inherit; }
  footer { margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Rangeur</h1>
  <p>Outil personnel et privé. Il range automatiquement les fichiers d'un seul ordinateur vers le Google Drive de son propriétaire, pour libérer de la place sur la machine.</p>
  <p>Il n'est pas proposé au public : aucune inscription, aucun autre utilisateur.</p>
  <footer><a href="privacy.html">Règles de confidentialité</a></footer>
</main>
</body>
</html>
